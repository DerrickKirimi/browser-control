<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Strict action success during GRPO training for seeds 23, 47, and 71</title>
  <desc id="desc">All three runs reach eight successes out of eight samples by group eight and remain perfect through group sixty.</desc>
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#111827">Strict action success during GRPO training</text>
  <text x="460" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">First 12 groups shown; every seed remained 8/8 through group 60</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="410" x2="860" y2="410"/>
    <line x1="90" y1="330" x2="860" y2="330"/>
    <line x1="90" y1="250" x2="860" y2="250"/>
    <line x1="90" y1="170" x2="860" y2="170"/>
    <line x1="90" y1="90" x2="860" y2="90"/>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="90" y1="90" x2="90" y2="410"/>
    <line x1="90" y1="410" x2="860" y2="410"/>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#4b5563">
    <text x="75" y="414" text-anchor="end">0</text>
    <text x="75" y="334" text-anchor="end">2</text>
    <text x="75" y="254" text-anchor="end">4</text>
    <text x="75" y="174" text-anchor="end">6</text>
    <text x="75" y="94" text-anchor="end">8</text>
    <text x="90" y="432" text-anchor="middle">0</text>
    <text x="230" y="432" text-anchor="middle">2</text>
    <text x="370" y="432" text-anchor="middle">4</text>
    <text x="510" y="432" text-anchor="middle">6</text>
    <text x="650" y="432" text-anchor="middle">8</text>
    <text x="790" y="432" text-anchor="middle">10</text>
    <text x="860" y="432" text-anchor="middle">11</text>
    <text x="475" y="466" text-anchor="middle" font-size="14">GRPO generation group</text>
    <text x="24" y="250" text-anchor="middle" font-size="14" transform="rotate(-90 24 250)">Strict successes out of 8</text>
  </g>

  <polyline points="90,410 160,410 230,410 300,330 370,210 440,170 510,210 580,130 650,90 720,90 790,90 860,90" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90,410 160,330 230,330 300,330 370,130 440,130 510,90 580,90 650,90 720,90 790,90 860,90" fill="none" stroke="#d97706" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90,370 160,290 230,170 300,90 370,90 440,90 510,90 580,90 650,90 720,90 790,90 860,90" fill="none" stroke="#059669" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <g font-family="sans-serif" font-size="13" fill="#111827">
    <line x1="590" y1="475" x2="625" y2="475" stroke="#2563eb" stroke-width="4"/><text x="633" y="479">seed 23</text>
    <line x1="690" y1="475" x2="725" y2="475" stroke="#d97706" stroke-width="4"/><text x="733" y="479">seed 47</text>
    <line x1="790" y1="475" x2="825" y2="475" stroke="#059669" stroke-width="4"/><text x="833" y="479">seed 71</text>
  </g>
</svg>
