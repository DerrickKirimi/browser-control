[project]
name = "browser-control-rl"
version = "0.1.0"
description = "Training small Liquid models to control a browser, with verifiable evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
environment = [
    "browsergym-miniwob==0.14.3",
]
model = [
    "transformers==4.57.3",
]
training = [
    "peft==0.19.1",
    "trl==0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_control"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
