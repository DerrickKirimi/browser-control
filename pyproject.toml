[project]
name = "browser-control-rl"
version = "0.1.0"
description = "A validated, Colab-first GRPO pipeline for browser control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
environment = [
    "browsergym-miniwob==0.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_control"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
