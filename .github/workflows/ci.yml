name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and project
        run: uv sync --python 3.11 --locked
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check .
